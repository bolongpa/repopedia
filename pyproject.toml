[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repopedia"
version = "0.1.0"
description = "MIT-licensed code knowledge graph: index any source repo into a queryable graph of symbols, calls, and dependencies"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Bolong Pan" }]
keywords = ["code-graph", "knowledge-graph", "tree-sitter", "code-search", "mcp"]
dependencies = [
    "tree-sitter==0.26.0",
    "tree-sitter-python==0.25.0",
    "tree-sitter-typescript==0.23.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
repopedia = "repopedia.cli:main"

[project.urls]
Homepage = "https://github.com/bolongpa/repopedia"

[tool.setuptools.packages.find]
include = ["repopedia*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
